<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ebag Logo</title>
  <style>
    .ebae-logo {
      font-family: "Arial Rounded MT Bold", "Helvetica Neue", Arial, sans-serif;
        font-weight: bold;
        font-size: 100px;
        letter-spacing: -13px;
        line-height: 1;
        padding: 1em;
    }
    .ebae-logo span {
      display: inline-block;
      margin-right: -10px; /* overlap slightly */
    }
    .ebae-logo .e1 { color: #E53238; }  /* red */
    .ebae-logo .b  { color: #0064D2; }  /* blue */
    .ebae-logo .a  { color: #F5AF02; }  /* yellow/orange */
    .ebae-logo .g  { color: #86B817; }  /* green */
  </style>
</head>
<body>
  <div class="ebae-logo">
    <span class="e1">e</span>
    <span class="b">b</span>
    <span class="a">a</span>
    <span class="g">g</span>
  </div>
</body>
</html>
