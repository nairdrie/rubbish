<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading Animation Truck + Trash (Arc)</title>
  <style>
  @keyframes bump {
    0%, 100% { transform: translateY(0); }
    10% { transform: translateY(-2px); }
    25% { transform: translateY(1px); }
    40% { transform: translateY(0px); }
    55% { transform: translateY(2px); }
    70% { transform: translateY(-1px); }
    85% { transform: translateY(0px); }
  }
  @keyframes wheelspin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  @keyframes toss {
    0% {
      offset-distance: 0%;
      opacity: 0;
      transform: rotate(0deg) scale(0.9);
    }
    10% { opacity: 1; }
    50% {
      transform: rotate(180deg) scale(1);
    }
    90% { opacity: 1; }
    100% {
      offset-distance: 100%;
      opacity: 0;
      transform: rotate(360deg) scale(0.92);
    }
  }

  html, body {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    --bg: #1c1922;
    --fg: #dccff8;
    background: var(--bg);
  }

  .truck-container {
    position: relative;
    width: 300px;
    height: 150px;
    animation: bump 2s ease-in-out infinite;
    overflow: visible;
  }

  .truck-body {
    position: absolute;
    bottom: 30px;
    left: 15px;
    width: 181px;
    height: 93px;
    background: var(--fg);
    border-radius: 4px;
    border-top-left-radius: 62px;
  }

  .truck-cab {
    position: absolute;
    bottom: 30px;
    left: 206px;
    width: 65px;
    height: 73px;
    background: var(--fg);
    border-radius: 4px 38px 4px 4px;
  }

  .cab-window {
    position: absolute;
    bottom: 61px;
    left: 213px;
    width: 51px;
    height: 34px;
    background: var(--bg);
    border-radius: 4px 33px 4px 4px;
  }

  .wheel {
    position: absolute;
    bottom: -6px;
    width: 34px;
    height: 34px;
    background: var(--fg);
    border-radius: 50%;
    animation: wheelspin 2s linear infinite;
    border: 8px solid var(--bg);
  }
  .wheel::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    background: var(--bg);
    border-radius: 2px;
    transform: translate(-50%, -50%);
  }
  .wheel.back  { left: 29px; }
  .wheel.mid   { left: 81px; }
  .wheel.front { left: 214px; }

  .trash {
    z-index: -1;
    position: absolute;
    offset-rotate: auto; /* follow curve */
    offset-path: path(var(--path));
    width: var(--sz, 14px);
    height: var(--sz, 14px);
    background: var(--fg);
    clip-path: polygon(12% 8%, 35% 0%, 60% 10%, 88% 12%, 92% 40%, 82% 64%, 64% 74%, 48% 92%, 26% 80%, 8% 58%, 0% 34%);
    border-radius: 3px;
    box-shadow:
      inset 0 0 0 1px rgba(0,0,0,0.08),
      inset 4px 3px 6px rgba(0,0,0,0.12),
      inset -3px -2px 5px rgba(255,255,255,0.12);
    opacity: 0;
    animation: toss var(--dur, 1.8s) cubic-bezier(.25,.6,.2,1) infinite;
    animation-delay: var(--delay, 0s);
  }

  .t1 {
    --sz: 22px;
    --dur: 1s;
    --delay: 0s;
    --path: "M -80 105 Q 0 20, 55 88";
  }
  .t2 {
    --sz: 20px;
    --dur: 1.5s;
    --delay: 0s;
    --path: "M -90 100 Q -10 10, 68 90";
  }
  .t3 {
    --sz: 24px;
    --dur: 2s;
    --delay: 0s;
    --path: "M -85 108 Q -5 25, 45 92";
  }

  .truck-mouth {
    position: absolute;
    left: 15px;
    bottom: 96px;
    width: 10px;
    height: 22px;
    background: var(--bg);
    border-radius: 2px;
    opacity: .25;
    visibility: hidden;
  }
</style>
</head>
<body>
  <div class="truck-container">
    <div class="truck-body"></div>
    <div class="truck-cab"></div>
    <div class="cab-window"></div>
    <div class="wheel back"></div>
    <div class="wheel mid"></div>
    <div class="wheel front"></div>
    <div class="truck-mouth" aria-hidden="true"></div>

    <!-- Trash pieces (single color, crumpled, arcing into the back) -->
    <div class="trash t1"></div>
    <div class="trash t2"></div>
    <div class="trash t3"></div>
  </div>
</body>
</html>
